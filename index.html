<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful | Kypria Technologies</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #0a0a0a 100%);
            color: #e8e8e8;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }
        
        .success-container {
            max-width: 600px;
            width: 100%;
            text-align: center;
            background: rgba(26, 26, 46, 0.6);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 12px;
            padding: 3rem 2rem;
            backdrop-filter: blur(10px);
            animation: fadeIn 0.8s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .checkmark {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 4px solid #d4af37;
            margin: 0 auto 2rem;
            position: relative;
            animation: checkmarkPop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        @keyframes checkmarkPop {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        
        .checkmark::after {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3rem;
            color: #d4af37;
        }
        
        h1 {
            font-size: 2.5rem;
            color: #d4af37;
            margin-bottom: 1rem;
            letter-spacing: 2px;
        }
        
        .subtitle {
            font-size: 1.2rem;
            color: #c0c0c0;
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        
        .details {
            background: rgba(10, 10, 10, 0.4);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 8px;
            padding: 1.5rem;
            margin: 2rem 0;
            text-align: left;
        }
        
        .details p {
            margin-bottom: 0.8rem;
            color: #c0c0c0;
            font-size: 1rem;
        }
        
        .details p:last-child {
            margin-bottom: 0;
        }
        
        .details strong {
            color: #d4af37;
        }
        
        .btn-primary {
            display: inline-block;
            background: linear-gradient(135deg, #d4af37 0%, #f4d03f 100%);
            color: #1a1a1a;
            padding: 1rem 2.5rem;
            font-size: 1.1rem;
            font-weight: 600;
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.3s;
            box-shadow: 0 4px 20px rgba(212, 175, 55, 0.4);
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-top: 1rem;
        }
        
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(212, 175, 55, 0.6);
        }
        
        .footer {
            margin-top: 2rem;
            font-size: 0.9rem;
            color: #666;
        }
        
        .footer a {
            color: #d4af37;
            text-decoration: none;
        }
        
        .footer a:hover {
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="success-container">
        <div class="checkmark"></div>
        
        <h1>Payment Successful!</h1>
        <p class="subtitle">Welcome to the Basilica. Your support fuels the legend.</p>
        
        <div class="details">
            <p><strong>What happens next:</strong></p>
            <p>✦ You'll receive a confirmation email within 5 minutes</p>
            <p>✦ Your patron access has been activated</p>
            <p>✦ Check your email for exclusive content links</p>
        </div>
        
        <a href="https://alexandros-thomson.github.io/kypriatechnologies/" class="btn-primary">Return to Basilica</a>
        
        <div class="footer">
            <p>Questions? <a href="mailto:contact@kypriatechnologies.org">Contact Support</a></p>
        </div>
    </div>
    
    <script>
        // Get URL parameters for order confirmation
        const urlParams = new URLSearchParams(window.location.search);
        const sessionId = urlParams.get('session_id');
        
        if (sessionId) {
            console.log('Stripe session ID:', sessionId);
            // You can send this to your backend for verification
        }
    </script>
</body>
</html>
